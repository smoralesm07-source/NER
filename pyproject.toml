[project]
name = "ner-prensa-github"
version = "0.1.0"
description = "Extractor híbrido de entidades para noticias: GLiNER2 + reglas + LLM Structured Output"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.8",
  "trafilatura>=2.0",
  "openai>=1.50",
]

[project.optional-dependencies]
local = ["gliner2[local]>=1.3.2"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
